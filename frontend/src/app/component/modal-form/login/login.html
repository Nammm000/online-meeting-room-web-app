@if (isVisible()) {
<!-- Backdrop -->
<div class="modal-backdrop" (click)="close()"></div>

<!-- Modal Content -->
<div class="modal-container" appAutoHideScrollbar>
  <!-- Header -->
  <div class="modal-header form-header">
    <h2 class="modal-title">Login</h2>
    <button class="close-button" (click)="close()">
      <span class="close-icon">&times;</span
      ><!-- &times; × -->
    </button>
  </div>

  <div class="modal-content form-content">
    <!-- Body - Form -->
    <form class="modal-form" (ngSubmit)="submit($event)">
      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          [class.error]="!isEmailValid() && email()"
          placeholder="Enter your email"
        />
        @if (!isEmailValid() && email()) {
        <p class="error-message">Please enter a valid email address</p>
        }
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input
            [type]="hide ? 'password':'text'"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="Enter your password"
          />
          <button
            class="password-toggle"
            type="button"
            (click)="hide = !hide"
            [attr.aria-label]="hide ? 'Show password' : 'Hide password'"
          >
            @if (hide) {
              <i class="icon-18 eye"></i>
            } @else {
              <i class="icon-18 eye-slash"></i>
            }
          </button>
        </div>
      </div>

      <!-- API Error -->
      @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
      }

      <!-- Submit Button -->
      <button
        type="submit"
        class="submit-button"
        [disabled]="!canSubmit() || submitting()"
      >
        Login
      </button>
    </form>
  </div>
</div>
}
