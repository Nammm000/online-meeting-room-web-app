@if (modalService.joinPassword(); as request) {
<div class="modal-backdrop" (click)="close()"></div>

<div class="modal-container modal-container--sm" appAutoHideScrollbar
     role="dialog" aria-modal="true" [attr.aria-label]="langService.t('joinPassword.title')">
  <div class="modal-header form-header">
    <h2 class="modal-title">{{ langService.t('joinPassword.title') }}</h2>
    <button class="close-button" type="button" (click)="close()" aria-label="Close">
      <span class="close-icon">&times;</span>
    </button>
  </div>

  <div class="modal-content form-content">
    @if (request.meetingTitle) {
    <p class="confirmation-message">{{ request.meetingTitle }}</p>
    }
    @if (request.errorMessage) {
    <p class="error-message">{{ request.errorMessage }}</p>
    }
    <form class="modal-form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="join-password-input">{{ langService.t('joinPassword.label') }}</label>
        <input
          type="password"
          id="join-password-input"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="off"
          maxlength="100"
          [placeholder]="langService.t('joinPassword.placeholder')"
        />
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary-button" (click)="close()">
          {{ langService.t('joinPassword.cancel') }}
        </button>
        <button type="submit" class="submit-button" [disabled]="!canSubmit()">
          {{ langService.t('joinPassword.submit') }}
        </button>
      </div>
    </form>
  </div>
</div>
}
