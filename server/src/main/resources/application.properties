app.client.url=http://localhost:4200

# Rate limiting — per-identity sliding window (JWT subject, else client IP); excess -> 429 + Retry-After
app.rate-limit.requests-per-second=3

# Set to true when the app is served behind TLS; Secure cookies are rejected on plain http dev.
app.cookie.secure=false

# Notifications (WebSocket broadcast) — interval defaults to 30 minutes
app.notification.interval-ms=1800000
app.notification.message=Reminder: please review your works.

# MinIO (S3-compatible) object storage for user images and PDF files
app.minio.endpoint=http://localhost:9002
app.minio.access-key=minioadmin
app.minio.secret-key=minioadmin
app.minio.bucket=user-images
app.minio.pdf-bucket=user-pdf-files

# LiveKit (video SFU) — url/key/secret must match docker/livekit/livekit.yaml.
# token-ttl bounds the reconnect window for removed participants; empty-room
# timeout is the orphan-room backstop when a DeleteRoom call fails.
app.livekit.url=http://localhost:7880
app.livekit.api-key=devkey
app.livekit.api-secret=devlksecret-8c2f41a9d6e03b5741cafeb2d90863
app.livekit.token-ttl=PT5M
app.livekit.room-empty-timeout-seconds=900

# Janus AudioBridge (audio MCU) — http-url is the Spring control channel
# (admin API), ws-url is handed to browsers in join credentials. admin-key must
# match docker/janus/etc/janus.d/janus.plugin.audiobridge.jcfg. Per-room
# secret/pin are derived deterministically from the pepper (RoomSecretDeriver)
# so they survive restarts without a schema change.
app.janus.http-url=http://localhost:8088/janus
app.janus.ws-url=ws://localhost:8188
app.janus.admin-key=devjanusadminkey
app.janus.room-secret-pepper=devjanuspepper-5e1b9c4a7f2d8036b5e4
app.janus.sampling-rate=48000

# Multipart caps sit above the service limits (5MB avatar / 20MB PDF x up to 10 files per
# request) so oversize uploads fail in the service with a clear message
spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=220MB
# Swallow whole oversized request bodies so they get the JSON 400 instead of a connection reset
server.tomcat.max-swallow-size=220MB

# Redis cache — backing store for @Cacheable/@CacheEvict (see configuration/RedisCacheConfig)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Lettuce command timeout: caps how long a cache op stalls when Redis is unreachable
# (cache errors are swallowed by RedisCacheConfig's handler and requests fall through to the DB)
spring.data.redis.timeout=2s
# Inert with the custom CacheManager bean; documents the provider choice
spring.cache.type=redis

# Bloom filters (Guava, in-memory) — cache-penetration guard for both passbook read paths.
# Rebuilt from the DB at startup; a failed rebuild leaves them in pass-through mode
# (every check degrades to the DB). See docs/redis.md.
app.cache.bloom.expected-insertions=100000
app.cache.bloom.fpp=0.01

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/myrooms
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable JPA second-level cache to prevent memory leaks
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false